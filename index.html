<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Starfield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .controls label {
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        .controls input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #4da6ff;
        }

        .trail-value {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            Trail Length: <span class="trail-value" id="trailValue">50</span>
        </label>
        <input type="range" id="trailSlider" min="5" max="100" value="50">
    </div>
    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        const trailSlider = document.getElementById('trailSlider');
        const trailValueDisplay = document.getElementById('trailValue');

        let width, height, centerX, centerY;
        let trailLength = 50;
        const numStars = 400;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Start near the center with a small random offset
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 50 + 10;
                this.x = centerX + Math.cos(angle) * distance;
                this.y = centerY + Math.sin(angle) * distance;

                // Direction from center
                this.angle = Math.atan2(this.y - centerY, this.x - centerX);

                // Speed increases as star moves outward
                this.speed = Math.random() * 2 + 1;
                this.acceleration = 1.02;

                // Size and brightness
                this.size = Math.random() * 1.5 + 0.5;
                this.brightness = Math.random() * 0.5 + 0.5;

                // Color variation (white to blue tint)
                this.hue = Math.random() * 60 + 200; // 200-260 (blue range)
                this.saturation = Math.random() * 30;
            }

            update() {
                // Store previous position for trail
                this.prevX = this.x;
                this.prevY = this.y;

                // Move outward from center
                this.speed *= this.acceleration;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Increase size as it gets closer (perspective effect)
                const distFromCenter = Math.hypot(this.x - centerX, this.y - centerY);
                this.currentSize = this.size * (1 + distFromCenter / 200);

                // Reset if off screen
                if (this.x < -50 || this.x > width + 50 ||
                    this.y < -50 || this.y > height + 50) {
                    this.reset();
                }
            }

            draw() {
                const distFromCenter = Math.hypot(this.x - centerX, this.y - centerY);

                // Calculate trail end point based on trail length
                const trailFactor = trailLength / 50;
                const dx = this.x - this.prevX;
                const dy = this.y - this.prevY;
                const trailX = this.x - dx * trailFactor * 3;
                const trailY = this.y - dy * trailFactor * 3;

                // Create gradient for trail
                const gradient = ctx.createLinearGradient(trailX, trailY, this.x, this.y);
                const alpha = Math.min(1, distFromCenter / 100) * this.brightness;

                gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, 100%, 0)`);
                gradient.addColorStop(0.5, `hsla(${this.hue}, ${this.saturation}%, 90%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, 100%, ${alpha})`);

                // Draw trail
                ctx.beginPath();
                ctx.moveTo(trailX, trailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.currentSize;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw star glow
                const glowSize = this.currentSize * 2;
                const glow = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, glowSize
                );
                glow.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, 100%, ${alpha})`);
                glow.addColorStop(0.5, `hsla(${this.hue}, ${this.saturation}%, 80%, ${alpha * 0.3})`);
                glow.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, 60%, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
            }
        }

        function init() {
            resize();
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                const star = new Star();
                // Spread initial stars across the screen
                star.x = Math.random() * width;
                star.y = Math.random() * height;
                star.angle = Math.atan2(star.y - centerY, star.x - centerX);
                star.speed = Math.random() * 5 + 2;
                stars.push(star);
            }
        }

        function animate() {
            // Create motion blur effect with semi-transparent background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw stars
            for (const star of stars) {
                star.update();
                star.draw();
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', () => {
            resize();
        });

        trailSlider.addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            trailValueDisplay.textContent = trailLength;
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
