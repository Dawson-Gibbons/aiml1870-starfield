<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperspace Starfield</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Orbitron', sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }

    .controls {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(10, 5, 20, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 100, 200, 0.3);
      border-radius: 12px;
      min-width: 220px;
      box-shadow:
        0 0 40px rgba(255, 50, 150, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .controls-header {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease;
    }

    .controls-header:hover {
      background: rgba(255, 100, 200, 0.1);
    }

    .controls-header h3 {
      color: rgba(255, 180, 220, 0.9);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 20px rgba(255, 100, 200, 0.5);
    }

    .toggle-icon {
      color: rgba(255, 180, 220, 0.7);
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .controls.collapsed .toggle-icon {
      transform: rotate(180deg);
    }

    .controls-content {
      padding: 0 20px 20px 20px;
      max-height: 200px;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
      opacity: 1;
    }

    .controls.collapsed .controls-content {
      max-height: 0;
      padding: 0 20px;
      opacity: 0;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 200, 230, 0.7);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .slider-value {
      color: #ff9ed2;
      font-weight: 700;
      font-size: 12px;
      text-shadow: 0 0 10px rgba(255, 100, 200, 0.6);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg,
        rgba(180, 60, 150, 0.4) 0%,
        rgba(255, 100, 200, 0.6) 100%);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffc0e0, #ff40a0);
      border-radius: 50%;
      cursor: pointer;
      box-shadow:
        0 0 15px rgba(255, 100, 200, 0.8),
        0 0 30px rgba(255, 100, 200, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow:
        0 0 20px rgba(255, 150, 220, 1),
        0 0 40px rgba(255, 150, 220, 0.6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffc0e0, #ff40a0);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow:
        0 0 15px rgba(255, 100, 200, 0.8),
        0 0 30px rgba(255, 100, 200, 0.4);
    }

    .speed-control {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 100, 200, 0.15);
    }

    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 150, 200, 0.4);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 100, 200, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="controls" id="controls">
    <div class="controls-header" id="controlsHeader">
      <h3>Hyperspace Controls</h3>
      <span class="toggle-icon">▲</span>
    </div>

    <div class="controls-content">
      <div class="slider-container">
        <div class="slider-label">
          <span>Trail Length</span>
          <span class="slider-value" id="trailValue">50</span>
        </div>
        <input type="range" id="trailSlider" min="5" max="150" value="50">
      </div>

      <div class="slider-container speed-control">
        <div class="slider-label">
          <span>Warp Speed</span>
          <span class="slider-value" id="speedValue">15</span>
        </div>
        <input type="range" id="speedSlider" min="2" max="40" value="15">
      </div>
    </div>
  </div>

  <div class="hint">Entering Hyperspace</div>

  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let trailLength = 50;
    let speed = 15;
    const numStars = 600;
    const stars = [];

    // UI Elements
    const controls = document.getElementById('controls');
    const controlsHeader = document.getElementById('controlsHeader');
    const trailSlider = document.getElementById('trailSlider');
    const trailValue = document.getElementById('trailValue');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    // Toggle controls dropdown
    controlsHeader.addEventListener('click', () => {
      controls.classList.toggle('collapsed');
    });

    trailSlider.addEventListener('input', (e) => {
      trailLength = parseInt(e.target.value);
      trailValue.textContent = trailLength;
    });

    speedSlider.addEventListener('input', (e) => {
      speed = parseInt(e.target.value);
      speedValue.textContent = speed;
    });

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }

    window.addEventListener('resize', resize);
    resize();

    // Color palettes - warm sunset/nebula colors
    const colorPalettes = [
      { hue: 320, sat: 80 },  // Pink/Magenta
      { hue: 280, sat: 70 },  // Purple
      { hue: 340, sat: 85 },  // Hot pink
      { hue: 20, sat: 90 },   // Orange
      { hue: 45, sat: 95 },   // Gold
      { hue: 180, sat: 60 },  // Teal accent
    ];

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        // Start near center with random angle
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 50 + 5;

        this.x = Math.cos(angle) * distance;
        this.y = Math.sin(angle) * distance;
        this.z = Math.random() * 1000 + 500;

        // Velocity direction from center
        this.vx = this.x * 0.001;
        this.vy = this.y * 0.001;

        // Star properties
        this.brightness = Math.random() * 0.5 + 0.5;

        // Pick from color palette with weighted randomness
        const palette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
        this.hue = palette.hue + (Math.random() * 30 - 15);
        this.saturation = palette.sat + (Math.random() * 20 - 10);
      }

      update() {
        // Move star towards viewer (decrease z)
        this.z -= speed;

        // Expand outward as it gets closer
        const expansion = (1000 - this.z) / 1000;
        this.x += this.vx * speed * expansion * 2;
        this.y += this.vy * speed * expansion * 2;

        // Reset if too close or off screen
        if (this.z < 1) {
          this.reset();
        }

        const screenX = (this.x / this.z) * 1000 + centerX;
        const screenY = (this.y / this.z) * 1000 + centerY;

        if (screenX < -100 || screenX > width + 100 ||
            screenY < -100 || screenY > height + 100) {
          this.reset();
        }
      }

      draw() {
        // Current position
        const screenX = (this.x / this.z) * 1000 + centerX;
        const screenY = (this.y / this.z) * 1000 + centerY;

        // Calculate trail end position (where star was)
        const trailZ = this.z + trailLength * (speed / 10);
        const trailExpansion = (1000 - trailZ) / 1000;
        const pastX = this.x - this.vx * speed * trailExpansion * 2 * (trailLength / 10);
        const pastY = this.y - this.vy * speed * trailExpansion * 2 * (trailLength / 10);

        const trailX = (pastX / trailZ) * 1000 + centerX;
        const trailY = (pastY / trailZ) * 1000 + centerY;

        // Size based on distance - bigger stars!
        const size = Math.max(0.5, (1 - this.z / 1500) * 4);

        // Opacity based on distance
        const alpha = Math.min(1, (1 - this.z / 1500) * this.brightness);

        // Draw trail
        const gradient = ctx.createLinearGradient(trailX, trailY, screenX, screenY);
        gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, 60%, 0)`);
        gradient.addColorStop(0.5, `hsla(${this.hue}, ${this.saturation - 10}%, 70%, ${alpha * 0.5})`);
        gradient.addColorStop(1, `hsla(${this.hue}, ${this.saturation - 20}%, 90%, ${alpha})`);

        ctx.beginPath();
        ctx.moveTo(trailX, trailY);
        ctx.lineTo(screenX, screenY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Draw star head (bright point)
        ctx.beginPath();
        ctx.arc(screenX, screenY, size * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, ${this.saturation - 30}%, 95%, ${alpha})`;
        ctx.fill();

        // Glow effect
        const glowGradient = ctx.createRadialGradient(
          screenX, screenY, 0,
          screenX, screenY, size * 5
        );
        glowGradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, 80%, ${alpha * 0.5})`);
        glowGradient.addColorStop(1, `hsla(${this.hue}, ${this.saturation}%, 80%, 0)`);

        ctx.beginPath();
        ctx.arc(screenX, screenY, size * 5, 0, Math.PI * 2);
        ctx.fillStyle = glowGradient;
        ctx.fill();
      }
    }

    // Initialize stars with more near the edges (lower z values)
    for (let i = 0; i < numStars; i++) {
      const star = new Star();
      // Bias toward lower z values (closer/edge stars) for more density at edges
      const zBias = Math.pow(Math.random(), 0.6); // Power < 1 biases toward lower values
      star.z = zBias * 1500;
      stars.push(star);
    }

    // Central glow effect - warmer colors
    function drawCenterGlow() {
      const gradient = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, 200
      );
      gradient.addColorStop(0, 'rgba(255, 200, 230, 0.1)');
      gradient.addColorStop(0.3, 'rgba(255, 100, 180, 0.05)');
      gradient.addColorStop(0.6, 'rgba(150, 50, 150, 0.02)');
      gradient.addColorStop(1, 'rgba(50, 20, 80, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    // Vignette effect - purple tint
    function drawVignette() {
      const gradient = ctx.createRadialGradient(
        centerX, centerY, height * 0.3,
        centerX, centerY, height * 0.9
      );
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(1, 'rgba(20, 0, 30, 0.8)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function animate() {
      // Slight motion blur effect - darker purple tint
      ctx.fillStyle = 'rgba(5, 0, 10, 0.25)';
      ctx.fillRect(0, 0, width, height);

      drawCenterGlow();

      // Update and draw stars
      for (const star of stars) {
        star.update();
        star.draw();
      }

      drawVignette();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
