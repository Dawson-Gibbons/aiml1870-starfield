<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperspace Starfield</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Orbitron', sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }

    .controls {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 140, 255, 0.3);
      border-radius: 12px;
      padding: 20px 24px;
      min-width: 220px;
      box-shadow:
        0 0 40px rgba(80, 120, 255, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .controls h3 {
      color: rgba(180, 200, 255, 0.9);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(200, 220, 255, 0.7);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .slider-value {
      color: #7eb8ff;
      font-weight: 700;
      font-size: 12px;
      text-shadow: 0 0 10px rgba(100, 180, 255, 0.6);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg,
        rgba(60, 100, 180, 0.4) 0%,
        rgba(100, 150, 255, 0.6) 100%);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #a0d0ff, #4080ff);
      border-radius: 50%;
      cursor: pointer;
      box-shadow:
        0 0 15px rgba(80, 150, 255, 0.8),
        0 0 30px rgba(80, 150, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow:
        0 0 20px rgba(100, 180, 255, 1),
        0 0 40px rgba(100, 180, 255, 0.6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #a0d0ff, #4080ff);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow:
        0 0 15px rgba(80, 150, 255, 0.8),
        0 0 30px rgba(80, 150, 255, 0.4);
    }

    .speed-control {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(100, 140, 255, 0.15);
    }

    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(150, 180, 255, 0.4);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="controls">
    <h3>Hyperspace Controls</h3>

    <div class="slider-container">
      <div class="slider-label">
        <span>Trail Length</span>
        <span class="slider-value" id="trailValue">50</span>
      </div>
      <input type="range" id="trailSlider" min="5" max="150" value="50">
    </div>

    <div class="slider-container speed-control">
      <div class="slider-label">
        <span>Warp Speed</span>
        <span class="slider-value" id="speedValue">15</span>
      </div>
      <input type="range" id="speedSlider" min="2" max="40" value="15">
    </div>
  </div>

  <div class="hint">Entering Hyperspace</div>

  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let trailLength = 50;
    let speed = 15;
    const numStars = 400;
    const stars = [];

    // UI Elements
    const trailSlider = document.getElementById('trailSlider');
    const trailValue = document.getElementById('trailValue');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    trailSlider.addEventListener('input', (e) => {
      trailLength = parseInt(e.target.value);
      trailValue.textContent = trailLength;
    });

    speedSlider.addEventListener('input', (e) => {
      speed = parseInt(e.target.value);
      speedValue.textContent = speed;
    });

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }

    window.addEventListener('resize', resize);
    resize();

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        // Start near center with random angle
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 50 + 5;

        this.x = Math.cos(angle) * distance;
        this.y = Math.sin(angle) * distance;
        this.z = Math.random() * 1000 + 500;

        // Velocity direction from center
        this.vx = this.x * 0.001;
        this.vy = this.y * 0.001;

        // Star properties
        this.brightness = Math.random() * 0.5 + 0.5;
        this.hue = Math.random() * 60 + 200; // Blue to cyan range
      }

      update() {
        // Move star towards viewer (decrease z)
        this.z -= speed;

        // Expand outward as it gets closer
        const expansion = (1000 - this.z) / 1000;
        this.x += this.vx * speed * expansion * 2;
        this.y += this.vy * speed * expansion * 2;

        // Reset if too close or off screen
        if (this.z < 1) {
          this.reset();
        }

        const screenX = (this.x / this.z) * 1000 + centerX;
        const screenY = (this.y / this.z) * 1000 + centerY;

        if (screenX < -100 || screenX > width + 100 ||
            screenY < -100 || screenY > height + 100) {
          this.reset();
        }
      }

      draw() {
        // Current position
        const screenX = (this.x / this.z) * 1000 + centerX;
        const screenY = (this.y / this.z) * 1000 + centerY;

        // Calculate trail end position (where star was)
        const trailZ = this.z + trailLength * (speed / 10);
        const trailExpansion = (1000 - trailZ) / 1000;
        const pastX = this.x - this.vx * speed * trailExpansion * 2 * (trailLength / 10);
        const pastY = this.y - this.vy * speed * trailExpansion * 2 * (trailLength / 10);

        const trailX = (pastX / trailZ) * 1000 + centerX;
        const trailY = (pastY / trailZ) * 1000 + centerY;

        // Size based on distance
        const size = Math.max(0.5, (1 - this.z / 1500) * 3);

        // Opacity based on distance
        const alpha = Math.min(1, (1 - this.z / 1500) * this.brightness);

        // Draw trail
        const gradient = ctx.createLinearGradient(trailX, trailY, screenX, screenY);
        gradient.addColorStop(0, `hsla(${this.hue}, 80%, 70%, 0)`);
        gradient.addColorStop(0.5, `hsla(${this.hue}, 70%, 80%, ${alpha * 0.5})`);
        gradient.addColorStop(1, `hsla(${this.hue}, 60%, 95%, ${alpha})`);

        ctx.beginPath();
        ctx.moveTo(trailX, trailY);
        ctx.lineTo(screenX, screenY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Draw star head (bright point)
        ctx.beginPath();
        ctx.arc(screenX, screenY, size * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue - 20}, 50%, 98%, ${alpha})`;
        ctx.fill();

        // Glow effect
        const glowGradient = ctx.createRadialGradient(
          screenX, screenY, 0,
          screenX, screenY, size * 4
        );
        glowGradient.addColorStop(0, `hsla(${this.hue}, 80%, 90%, ${alpha * 0.4})`);
        glowGradient.addColorStop(1, `hsla(${this.hue}, 80%, 90%, 0)`);

        ctx.beginPath();
        ctx.arc(screenX, screenY, size * 4, 0, Math.PI * 2);
        ctx.fillStyle = glowGradient;
        ctx.fill();
      }
    }

    // Initialize stars
    for (let i = 0; i < numStars; i++) {
      const star = new Star();
      star.z = Math.random() * 1500; // Spread initial positions
      stars.push(star);
    }

    // Central glow effect
    function drawCenterGlow() {
      const gradient = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, 150
      );
      gradient.addColorStop(0, 'rgba(200, 220, 255, 0.08)');
      gradient.addColorStop(0.5, 'rgba(100, 150, 255, 0.03)');
      gradient.addColorStop(1, 'rgba(50, 100, 200, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    // Vignette effect
    function drawVignette() {
      const gradient = ctx.createRadialGradient(
        centerX, centerY, height * 0.3,
        centerX, centerY, height * 0.9
      );
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(1, 'rgba(0, 0, 20, 0.7)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function animate() {
      // Slight motion blur effect
      ctx.fillStyle = 'rgba(0, 0, 10, 0.3)';
      ctx.fillRect(0, 0, width, height);

      drawCenterGlow();

      // Update and draw stars
      for (const star of stars) {
        star.update();
        star.draw();
      }

      drawVignette();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
