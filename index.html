<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Starfield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .controls label {
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        .controls input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #4da6ff;
        }

        .trail-value {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            Trail Length: <span class="trail-value" id="trailValue">50</span>
        </label>
        <input type="range" id="trailSlider" min="5" max="100" value="50">
    </div>
    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        const trailSlider = document.getElementById('trailSlider');
        const trailValueDisplay = document.getElementById('trailValue');

        let width, height, centerX, centerY;
        let trailLength = 50;
        const numStars = 250;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function createStar() {
            // Use polar coordinates - angle and distance from center
            return {
                angle: Math.random() * Math.PI * 2,
                dist: Math.random() * 0.01, // Start very close to center (0-1 range, will be scaled)
                speed: 0.002 + Math.random() * 0.002,
                size: Math.random() * 1.5 + 0.5,
                hue: Math.random() * 60 + 200,
                saturation: Math.random() * 30
            };
        }

        function init() {
            resize();
            stars.length = 0;

            // Clear the canvas completely
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Create stars spread out at different distances
            for (let i = 0; i < numStars; i++) {
                const star = createStar();
                star.dist = Math.random(); // Spread initial stars across full range
                stars.push(star);
            }
        }

        function animate() {
            // Clear with solid black for clean rendering
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            for (const star of stars) {
                // Move star outward
                star.dist += star.speed * (1 + star.dist * 3); // Accelerate as it moves out

                // Reset if off screen
                if (star.dist > 1.5) {
                    star.dist = 0.001;
                    star.angle = Math.random() * Math.PI * 2;
                    star.speed = 0.002 + Math.random() * 0.002;
                    continue; // Skip drawing this frame to avoid artifacts
                }

                // Calculate actual screen position
                const screenDist = star.dist * maxDist;
                const x = centerX + Math.cos(star.angle) * screenDist;
                const y = centerY + Math.sin(star.angle) * screenDist;

                // Don't draw if too close to center (prevents center artifacts)
                if (star.dist < 0.02) continue;

                // Calculate trail end (closer to center)
                const trailFactor = (trailLength / 100) * 0.3;
                const trailDist = Math.max(0, star.dist - trailFactor * star.dist);
                const trailScreenDist = trailDist * maxDist;
                const trailX = centerX + Math.cos(star.angle) * trailScreenDist;
                const trailY = centerY + Math.sin(star.angle) * trailScreenDist;

                // Brightness increases with distance from center
                const brightness = Math.min(1, star.dist * 1.5);
                const currentSize = star.size * (0.5 + star.dist * 2);

                // Draw trail
                const gradient = ctx.createLinearGradient(trailX, trailY, x, y);
                gradient.addColorStop(0, `hsla(${star.hue}, ${star.saturation}%, 100%, 0)`);
                gradient.addColorStop(1, `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`);

                ctx.beginPath();
                ctx.moveTo(trailX, trailY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = Math.max(0.5, currentSize);
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw star head
                ctx.beginPath();
                ctx.arc(x, y, Math.max(0.5, currentSize * 0.8), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', init);

        trailSlider.addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            trailValueDisplay.textContent = trailLength;
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
