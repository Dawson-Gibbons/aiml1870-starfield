<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Starfield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .controls label {
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        .controls input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #4da6ff;
        }

        .trail-value {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            Trail Length: <span class="trail-value" id="trailValue">50</span>
        </label>
        <input type="range" id="trailSlider" min="5" max="100" value="50">
    </div>
    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        const trailSlider = document.getElementById('trailSlider');
        const trailValueDisplay = document.getElementById('trailValue');

        let width, height, centerX, centerY;
        let trailLength = 50;
        const numStars = 300;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function createStar(spreadOut = false) {
            const angle = Math.random() * Math.PI * 2;
            let distance;

            if (spreadOut) {
                // For initial stars, spread them across the screen
                distance = Math.random() * Math.max(width, height) * 0.6 + 50;
            } else {
                // New stars start near center
                distance = Math.random() * 5 + 2;
            }

            const x = centerX + Math.cos(angle) * distance;
            const y = centerY + Math.sin(angle) * distance;

            return {
                x: x,
                y: y,
                z: spreadOut ? Math.random() * 1000 + 100 : 1000, // z for depth
                angle: angle,
                size: Math.random() * 1.5 + 0.5,
                hue: Math.random() * 60 + 200,
                saturation: Math.random() * 30
            };
        }

        function init() {
            resize();
            stars.length = 0;

            // Clear the canvas completely
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numStars; i++) {
                stars.push(createStar(true));
            }
        }

        function updateStar(star) {
            // Move star closer (decrease z)
            star.z -= 10;

            // Calculate screen position based on z depth
            const scale = 1000 / star.z;
            const dist = Math.max(width, height) * 0.6 * scale;

            star.x = centerX + Math.cos(star.angle) * dist;
            star.y = centerY + Math.sin(star.angle) * dist;

            // Reset if too close (z too small) or off screen
            if (star.z <= 1 ||
                star.x < -100 || star.x > width + 100 ||
                star.y < -100 || star.y > height + 100) {

                const newStar = createStar(false);
                star.x = newStar.x;
                star.y = newStar.y;
                star.z = newStar.z;
                star.angle = newStar.angle;
                star.size = newStar.size;
                star.hue = newStar.hue;
                star.saturation = newStar.saturation;
            }

            return scale;
        }

        function drawStar(star, scale) {
            // Only draw if star is in valid range
            if (star.z <= 1 || star.z > 1000) return;

            const brightness = Math.min(1, scale * 0.5);
            const currentSize = star.size * scale * 2;

            // Calculate trail length based on slider and speed
            const trailFactor = (trailLength / 50) * scale * 30;
            const trailEndX = centerX + Math.cos(star.angle) * (Math.max(width, height) * 0.6 * scale - trailFactor);
            const trailEndY = centerY + Math.sin(star.angle) * (Math.max(width, height) * 0.6 * scale - trailFactor);

            // Draw trail
            const gradient = ctx.createLinearGradient(trailEndX, trailEndY, star.x, star.y);
            gradient.addColorStop(0, `hsla(${star.hue}, ${star.saturation}%, 100%, 0)`);
            gradient.addColorStop(1, `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`);

            ctx.beginPath();
            ctx.moveTo(trailEndX, trailEndY);
            ctx.lineTo(star.x, star.y);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = Math.max(0.5, currentSize);
            ctx.lineCap = 'round';
            ctx.stroke();

            // Draw star point with glow
            ctx.beginPath();
            ctx.arc(star.x, star.y, Math.max(1, currentSize), 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`;
            ctx.fill();
        }

        function animate() {
            // Fade background for trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw each star
            for (const star of stars) {
                const scale = updateStar(star);
                drawStar(star, scale);
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', init);

        trailSlider.addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            trailValueDisplay.textContent = trailLength;
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
