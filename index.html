<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Starfield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .controls label {
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        .controls input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #4da6ff;
        }

        .trail-value {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            Trail Length: <span class="trail-value" id="trailValue">50</span>
        </label>
        <input type="range" id="trailSlider" min="5" max="100" value="50">
    </div>
    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        const trailSlider = document.getElementById('trailSlider');
        const trailValueDisplay = document.getElementById('trailValue');

        let width, height, centerX, centerY;
        let trailLength = 50;
        const numStars = 200;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function resetStar(star, randomizeDistance) {
            // Random angle from center
            const angle = Math.random() * Math.PI * 2;

            // Distance from center (normalized 0-1, where 1 = edge of screen)
            // New stars start at center, existing stars can be spread out
            const dist = randomizeDistance ? Math.random() * 0.8 + 0.1 : 0.01;

            star.angle = angle;
            star.dist = dist;
            star.prevDist = dist; // Previous distance for trail
            star.speed = 0.005 + Math.random() * 0.005;
            star.size = Math.random() * 1.5 + 0.5;
            star.hue = Math.random() * 60 + 200;
            star.saturation = Math.random() * 30;
        }

        function init() {
            resize();
            stars = [];

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numStars; i++) {
                const star = {};
                resetStar(star, true); // Spread initial stars
                stars.push(star);
            }
        }

        function getScreenPos(angle, dist) {
            // Convert normalized distance to actual screen distance
            const maxDist = Math.max(width, height);
            const screenDist = dist * maxDist;
            return {
                x: centerX + Math.cos(angle) * screenDist,
                y: centerY + Math.sin(angle) * screenDist
            };
        }

        function isOffScreen(x, y) {
            return x < -50 || x > width + 50 || y < -50 || y > height + 50;
        }

        function animate() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            for (const star of stars) {
                // Store previous distance for trail calculation
                star.prevDist = star.dist;

                // Move outward - accelerate as distance increases
                star.dist += star.speed * (1 + star.dist * 2);

                // Get current screen position
                const pos = getScreenPos(star.angle, star.dist);

                // Reset if off screen
                if (isOffScreen(pos.x, pos.y)) {
                    resetStar(star, false);
                    continue; // Don't draw this frame
                }

                // Don't draw if too close to center
                if (star.dist < 0.03) continue;

                // Calculate trail position (where star was)
                const trailFactor = (trailLength / 100) * 0.4;
                const trailDist = star.dist - (star.dist - star.prevDist) * trailFactor * 10;
                const trailPos = getScreenPos(star.angle, Math.max(0.01, trailDist));

                // Brightness based on distance
                const brightness = Math.min(1, star.dist * 2);
                const currentSize = star.size * (0.5 + star.dist * 3);

                // Draw the trail line
                const gradient = ctx.createLinearGradient(
                    trailPos.x, trailPos.y, pos.x, pos.y
                );
                gradient.addColorStop(0, `hsla(${star.hue}, ${star.saturation}%, 100%, 0)`);
                gradient.addColorStop(1, `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`);

                ctx.beginPath();
                ctx.moveTo(trailPos.x, trailPos.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = Math.max(0.5, currentSize);
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw star point
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, Math.max(0.5, currentSize), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${star.hue}, ${star.saturation}%, 100%, ${brightness})`;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);

        trailSlider.addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            trailValueDisplay.textContent = trailLength;
        });

        init();
        animate();
    </script>
</body>
</html>
